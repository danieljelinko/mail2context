[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name="mail2context"
version = "0.1.0"
description = "Converts email content into context for AI/LLM processing"
authors = [{name = "Dani Daniel Helinko", email = "daniel.jelinko@gmail.com"}]
requires-python=">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastcore>=1.5.29",
    "markdown-it-py>=4.2.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "nbdev>=2.3.12",
    "nbdev-template>=0.0.10",
    "jupyter>=1.0.0",
    "notebook>=6.0.0",
    "pytest>=8.3.5",
    "ruff>=0.16.0",
]

[tool.setuptools]
packages = ["mail2context"]

[tool.ruff.lint]
ignore = ["I001", "ISC004", "FURB167"]   # fight house style; see 1006_ruff_linting rule
